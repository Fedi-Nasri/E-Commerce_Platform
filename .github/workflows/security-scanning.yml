name: Security Scanning

on:
  workflow_dispatch:
    inputs:
      scan_target:
        description: "What to scan"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - trivy
          - sonarqube
          - zap
      zap_mode:
        description: "ZAP scan mode"
        required: false
        default: "baseline"
        type: choice
        options:
          - baseline
          - full
      zap_target_url:
        description: "URL for ZAP scan (leave empty to spin up local containers)"
        required: false
        default: ""
        type: string

  workflow_call:
    inputs:
      scan_target:
        required: false
        default: "all"
        type: string
      zap_mode:
        required: false
        default: "baseline"
        type: string
      zap_target_url:
        required: false
        default: ""
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/fedi-nasri/1111
  SONAR_PROJECT_KEY: galylioai_1111
  NODE_VERSION: "20.19.0"

concurrency:
  group: security-scanning
  cancel-in-progress: true

jobs:
# ─────────────────────────────────────────────
# JOB 1 — SONARQUBE SAST + SCA
# Static code analysis on source code.
# Requires SONAR_TOKEN and SONAR_HOST_URL secrets.
# SONAR_HOST_URL must be reachable from GitHub runners
# (a public URL, or run this job on a self-hosted runner).
# ─────────────────────────────────────────────
  sonarqube-scan:
    name: "SonarQube · Source Code Scan"
    runs-on: ubuntu-latest
    if: inputs.scan_target == 'all' || inputs.scan_target == 'sonarqube'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**
            -Dsonar.javascript.lcov.reportPaths=**/coverage/lcov.info
            -Dsonar.python.version=3.11

      - name: SonarQube Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt

      - name: Upload SonarQube report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-report
          path: .scannerwork/
          retention-days: 30
          if-no-files-found: ignore

# ─────────────────────────────────────────────
# JOB 2 — TRIVY IMAGE SCAN
# Pull images from GHCR and scan with Trivy.
# ─────────────────────────────────────────────
  trivy-scan:
    name: "Trivy · ${{ matrix.service }}"
    runs-on: ubuntu-latest
    if: inputs.scan_target == 'all' || inputs.scan_target == 'trivy'

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
          - service: auth
          - service: user
          - service: para
          - service: retail
          - service: mailer
          - service: alimentation
          - service: fashion
          - service: mailer-api
          - service: engagement
          - service: web-control
          - service: frontend

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy scanner (table)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Run Trivy scanner (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Run Trivy scanner (JSON for counting)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          format: 'json'
          output: 'trivy-${{ matrix.service }}.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Count findings
        if: always()
        run: |
          if [ -f "trivy-${{ matrix.service }}.json" ]; then
            CRITICAL=$(cat trivy-${{ matrix.service }}.json | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length')
            HIGH=$(cat trivy-${{ matrix.service }}.json | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length')
          else
            CRITICAL=0
            HIGH=0
          fi
          echo "CRITICAL=$CRITICAL" >> $GITHUB_ENV
          echo "HIGH=$HIGH" >> $GITHUB_ENV
          echo "## ${{ matrix.service }}" > trivy-${{ matrix.service }}-count.md
          echo "| Severity | Count |" >> trivy-${{ matrix.service }}-count.md
          echo "|----------|-------|" >> trivy-${{ matrix.service }}-count.md
          echo "| CRITICAL | $CRITICAL |" >> trivy-${{ matrix.service }}-count.md
          echo "| HIGH | $HIGH |" >> trivy-${{ matrix.service }}-count.md

      - name: Upload Trivy SARIF
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}
          path: |
            trivy-${{ matrix.service }}.sarif
            trivy-${{ matrix.service }}.json
            trivy-${{ matrix.service }}-count.md
          retention-days: 30

# ─────────────────────────────────────────────
# JOB 3 — OWASP ZAP DAST
# Run containers locally and scan with ZAP.
# Outputs: HTML report + Markdown summary.
# ─────────────────────────────────────────────
  zap-scan:
    name: "ZAP · DAST Scan"
    runs-on: ubuntu-latest
    if: inputs.scan_target == 'all' || inputs.scan_target == 'zap'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file for docker-compose
        run: |
          echo "${{ secrets.STAGING_ENV_FILE }}" > .env
          echo "NODE_ENV=deployment" >> .env

      - name: Determine target URL
        id: target
        run: |
          if [ -n "${{ inputs.zap_target_url }}" ]; then
            echo "url=${{ inputs.zap_target_url }}" >> $GITHUB_OUTPUT
            echo "mode=provided" >> $GITHUB_OUTPUT
          else
            echo "url=http://localhost:3001" >> $GITHUB_OUTPUT
            echo "mode=local" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        if: steps.target.outputs.mode == 'local'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images from GHCR
        if: steps.target.outputs.mode == 'local'
        run: |
          SERVICES="gateway auth user para retail alimentation fashion mailer-api engagement web-control mailer frontend"
          for SVC in $SERVICES; do
            echo "Pulling ${IMAGE_PREFIX}-${SVC}:latest..."
            docker pull ${IMAGE_PREFIX}-${SVC}:latest || echo "WARN: Failed to pull ${SVC}"
          done
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}

      - name: Start containers
        if: steps.target.outputs.mode == 'local'
        run: |
          docker volume create backend_postgres_data
          docker compose -f docker-compose.staging.yml up -d
          echo "Waiting for services to be healthy..."
          sleep 45
          docker compose -f docker-compose.staging.yml ps

      - name: Create ZAP test user for authenticated scanning
        if: steps.target.outputs.mode == 'local'
        run: |
          DB_USER=$(grep '^DB_USER=' .env | head -1 | cut -d= -f2-)
          DB_NAME=$(grep '^DB_NAME=' .env | head -1 | cut -d= -f2-)
          HASH=$(docker exec 1111-auth sh -c "node -e \"console.log(require('bcrypt').hashSync('hayder14405523*', 10))\"" 2>/dev/null || echo "")
          if [ -n "$HASH" ] && [ -n "$DB_USER" ] && [ -n "$DB_NAME" ]; then
            docker exec 1111-postgres psql -U "$DB_USER" -d "$DB_NAME" -c "
              INSERT INTO auth.users (id, full_name, email, password_hash, role, is_email_verified, is_active)
              VALUES (gen_random_uuid(), 'ZAP Scanner', 'demo.admin@1111.tn', '$HASH', 'admin', true, true)
              ON CONFLICT (email) DO UPDATE SET password_hash = EXCLUDED.password_hash, is_active = true;
            " 2>&1 || echo "WARN: Could not create ZAP user"
          else
            echo "WARN: Skipping ZAP user creation (hash or DB vars missing)"
          fi

      - name: OWASP ZAP Baseline Scan — Frontend (3001)
        if: steps.target.outputs.mode == 'provided' || (steps.target.outputs.mode == 'local' && inputs.zap_mode == 'baseline')
        uses: zaproxy/action-baseline@v0.15.0
        continue-on-error: true
        with:
          target: ${{ steps.target.outputs.url }}
          context_file: '.zap/1111-authenticated.context'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-j'
          allow_issue_writing: false

      - name: Save Frontend ZAP reports
        if: always() && (steps.target.outputs.mode == 'provided' || (steps.target.outputs.mode == 'local' && inputs.zap_mode == 'baseline'))
        run: |
          cp report_json.json zap-frontend-baseline.json 2>/dev/null || true
          cp report_html.html zap-frontend-baseline.html 2>/dev/null || true
          cp report_md.md   zap-frontend-baseline.md   2>/dev/null || true

      - name: OWASP ZAP Baseline Scan — Backend (3000)
        if: steps.target.outputs.mode == 'provided' || (steps.target.outputs.mode == 'local' && inputs.zap_mode == 'baseline')
        uses: zaproxy/action-baseline@v0.15.0
        continue-on-error: true
        with:
          target: http://localhost:3000
          context_file: '.zap/1111-authenticated.context'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-j'
          allow_issue_writing: false

      - name: Save Backend ZAP reports
        if: always() && (steps.target.outputs.mode == 'provided' || (steps.target.outputs.mode == 'local' && inputs.zap_mode == 'baseline'))
        run: |
          cp report_json.json zap-backend-baseline.json 2>/dev/null || true
          cp report_html.html zap-backend-baseline.html 2>/dev/null || true
          cp report_md.md   zap-backend-baseline.md   2>/dev/null || true

      - name: OWASP ZAP Full Scan — Frontend (3001)
        if: steps.target.outputs.mode == 'local' && inputs.zap_mode == 'full'
        uses: zaproxy/action-full-scan@v0.13.0
        continue-on-error: true
        with:
          target: ${{ steps.target.outputs.url }}
          context_file: '.zap/1111-authenticated.context'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-j'
          allow_issue_writing: false

      - name: Save Frontend ZAP Full reports
        if: always() && steps.target.outputs.mode == 'local' && inputs.zap_mode == 'full'
        run: |
          cp report_json.json zap-frontend-full.json 2>/dev/null || true
          cp report_html.html zap-frontend-full.html 2>/dev/null || true
          cp report_md.md   zap-frontend-full.md   2>/dev/null || true

      - name: OWASP ZAP Full Scan — Backend (3000)
        if: steps.target.outputs.mode == 'local' && inputs.zap_mode == 'full'
        uses: zaproxy/action-full-scan@v0.13.0
        continue-on-error: true
        with:
          target: http://localhost:3000
          context_file: '.zap/1111-authenticated.context'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-j'
          allow_issue_writing: false

      - name: Save Backend ZAP Full reports
        if: always() && steps.target.outputs.mode == 'local' && inputs.zap_mode == 'full'
        run: |
          cp report_json.json zap-backend-full.json 2>/dev/null || true
          cp report_html.html zap-backend-full.html 2>/dev/null || true
          cp report_md.md   zap-backend-full.md   2>/dev/null || true

      - name: Upload ZAP reports (HTML + JSON + MD)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report-${{ inputs.zap_mode || 'baseline' }}
          path: |
            zap-frontend-*
            zap-backend-*
            report.*
          retention-days: 30
          if-no-files-found: ignore

      - name: Stop containers
        if: always() && steps.target.outputs.mode == 'local'
        run: docker compose -f docker-compose.staging.yml down -v

# ─────────────────────────────────────────────
# JOB 4 — SECURITY SUMMARY
# Combines all reports into a single artifact + job summary.
# ─────────────────────────────────────────────
  security-summary:
    name: "Security Summary"
    runs-on: ubuntu-latest
    needs:
      - sonarqube-scan
      - trivy-scan
      - zap-scan
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: security-reports/
          pattern: '*'
          merge-multiple: true

      - name: Generate summary
        if: always()
        run: |
          echo "## Security Scanning Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Count totals from Trivy
          TOTAL_CRITICAL=0
          TOTAL_HIGH=0
          for f in security-reports/trivy-*-count.md; do
            if [ -f "$f" ]; then
              SVC=$(head -1 "$f" | sed 's/## //')
              CRIT=$(grep "CRITICAL" "$f" | grep -o '[0-9]*' | head -1)
              HIGH=$(grep "HIGH" "$f" | grep -o '[0-9]*' | head -1)
              TOTAL_CRITICAL=$((TOTAL_CRITICAL + CRIT))
              TOTAL_HIGH=$((TOTAL_HIGH + HIGH))
            fi
          done

          echo "### Trivy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Total Found |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| CRITICAL | **$TOTAL_CRITICAL** |" >> $GITHUB_STEP_SUMMARY
          echo "| HIGH | **$TOTAL_HIGH** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Per-service breakdown
          echo "### Per-Service Breakdown" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | CRITICAL | HIGH | Report |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----------|------|--------|" >> $GITHUB_STEP_SUMMARY
          for f in security-reports/trivy-*-count.md; do
            if [ -f "$f" ]; then
              SVC=$(head -1 "$f" | sed 's/## //')
              CRIT=$(grep "CRITICAL" "$f" | grep -o '[0-9]*' | head -1)
              HIGH=$(grep "HIGH" "$f" | grep -o '[0-9]*' | head -1)
              if [ "$CRIT" -gt 0 ]; then
                STATUS="🔴"
              elif [ "$HIGH" -gt 0 ]; then
                STATUS="🟡"
              else
                STATUS="🟢"
              fi
              echo "| $SVC | $STATUS $CRIT | $HIGH | [View](../trivy-$SVC) |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY

          # ZAP section
          echo "### ZAP Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Status | Report |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend (3001) | ${{ needs.zap-scan.result == 'success' && '✅ Completed' || '⚠️ Soft-fail' }} | [View](../zap-report-${{ inputs.zap_mode || 'baseline' }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend (3000) | ${{ needs.zap-scan.result == 'success' && '✅ Completed' || '⚠️ Soft-fail' }} | [View](../zap-report-${{ inputs.zap_mode || 'baseline' }}) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Download links
          echo "### Download" >> $GITHUB_STEP_SUMMARY
          echo "- [All Reports (zip)](../security-reports)" >> $GITHUB_STEP_SUMMARY
          echo "- [Trivy SARIF](../trivy-gateway) — upload to GitHub Security tab" >> $GITHUB_STEP_SUMMARY
          echo "- [ZAP HTML Reports](../zap-report-${{ inputs.zap_mode || 'baseline' }})" >> $GITHUB_STEP_SUMMARY

      - name: Upload combined reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: security-reports/
          retention-days: 30
          if-no-files-found: ignore
