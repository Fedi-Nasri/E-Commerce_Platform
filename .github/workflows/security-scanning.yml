name: Security Scanning

on:
  workflow_dispatch:
    inputs:
      scan_target:
        description: "What to scan"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - trivy
      #- sonarqube
      - zap
      zap_mode:
        description: "ZAP scan mode"
        required: false
        default: "baseline"
        type: choice
        options:
          - baseline
          - full
      zap_target_url:
        description: "URL for ZAP scan (leave empty to spin up local containers)"
        required: false
        default: ""
        type: string

  workflow_call:
    inputs:
      scan_target:
        required: false
        default: "all"
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/galylioai/1111
  SONAR_PROJECT_KEY: galylioai_1111
  NODE_VERSION: "20.19.0"

concurrency:
  group: security-scanning
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
