# ─────────────────────────────────────────────
# JOB 2 — TRIVY IMAGE SCAN
# Pull images from GHCR and scan with Trivy.
# ─────────────────────────────────────────────
  trivy-scan:
    name: "Trivy · ${{ matrix.service }}"
    runs-on: ubuntu-latest
    if: inputs.scan_target == 'all' || inputs.scan_target == 'trivy'

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
          - service: auth
          - service: user
          - service: para
          - service: retail
          - service: mailer
          - service: alimentation
          - service: fashion
          - service: mailer-api
          - service: engagement
          - service: web-control
          - service: frontend

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy scanner (table)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Run Trivy scanner (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Run Trivy scanner (JSON for counting)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          format: 'json'
          output: 'trivy-${{ matrix.service }}.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Count findings
        if: always()
        run: |
          if [ -f "trivy-${{ matrix.service }}.json" ]; then
            CRITICAL=$(cat trivy-${{ matrix.service }}.json | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length')
            HIGH=$(cat trivy-${{ matrix.service }}.json | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length')
          else
            CRITICAL=0
            HIGH=0
          fi
          echo "CRITICAL=$CRITICAL" >> $GITHUB_ENV
          echo "HIGH=$HIGH" >> $GITHUB_ENV
          echo "## ${{ matrix.service }}" > trivy-${{ matrix.service }}-count.md
          echo "| Severity | Count |" >> trivy-${{ matrix.service }}-count.md
          echo "|----------|-------|" >> trivy-${{ matrix.service }}-count.md
          echo "| CRITICAL | $CRITICAL |" >> trivy-${{ matrix.service }}-count.md
          echo "| HIGH | $HIGH |" >> trivy-${{ matrix.service }}-count.md

      - name: Upload Trivy SARIF
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}
          path: |
            trivy-${{ matrix.service }}.sarif
            trivy-${{ matrix.service }}.json
            trivy-${{ matrix.service }}-count.md
          retention-days: 30

# ─────────────────────────────────────────────
# JOB 3 — OWASP ZAP DAST
# Run containers locally and scan with ZAP.
# Outputs: HTML report + Markdown summary.
# ─────────────────────────────────────────────
  zap-scan:
    name: "ZAP · DAST Scan"
    runs-on: ubuntu-latest
    if: inputs.scan_target == 'all' || inputs.scan_target == 'zap'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file for docker-compose
        run: |
          cat > .env << 'ENDOFENV'
          NEXT_PUBLIC_API_URL=http://localhost:3000

          ALIMENTATION_DB_URL=postgresql://alimentation_user:galylio-ai@localhost:5435/alimentation_db
          PARA_DB_URL=postgresql://para_user:galylio-ai@localhost:5434/para_db
          RETAIL_DB_URL=postgresql://retail_user:galylio-ai@localhost:5433/retail_db

          DB_HOST=postgres
          DB_PORT=5432
          DB_NAME=appdb
          DB_USER=appuser
          DB_PASSWORD=galylio-ai

          RETAIL_DB_HOST=retail-postgres
          RETAIL_DB_PORT=5432
          RETAIL_DB_NAME=retail_db
          RETAIL_DB_USER=retail_user
          RETAIL_DB_PASSWORD=galylio-ai

          PARA_DB_HOST=para-postgres
          PARA_DB_PORT=5432
          PARA_DB_NAME=para_db
          PARA_DB_USER=para_user
          PARA_DB_PASSWORD=galylio-ai

          ALIMENTATION_DB_HOST=alimentation-postgres
          ALIMENTATION_DB_PORT=5432
          ALIMENTATION_DB_NAME=alimentation_db
          ALIMENTATION_DB_USER=alimentation_user
          ALIMENTATION_DB_PASSWORD=galylio-ai

          FASHION_DB_HOST=fashion-postgres
          FASHION_DB_PORT=5432
          FASHION_DB_NAME=fashion_db
          FASHION_DB_USER=fashion_user
          FASHION_DB_PASSWORD=galylio-ai

          CATALOG_DB_HOST=catalog-postgres
          CATALOG_DB_PORT=5432
          CATALOG_DB_NAME=catalog_db
          CATALOG_DB_USER=catalog_user
          CATALOG_DB_PASSWORD=galylio-ai
          CATALOG_DB_URL=postgres://catalog_user:galylio-ai@catalog-postgres:5432/catalog_db

          JWT_SECRET=115528f43e0352e7842a888d03d2fe26ed938fff0cff34fd8b53a93d262df5ae
          JWT_EXPIRES_IN=15m
          REFRESH_TOKEN_EXPIRES_DAYS=7

          RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
          RABBITMQ_USER=guest
          RABBITMQ_PASSWORD=guest

          SMTP_HOST=mailhog
          SMTP_PORT=1025
          SMTP_USER=
          SMTP_PASSWORD=
          SMTP_FROM=noreply@example.com
          SMTP_USE_TLS=false
          SMTP_USE_SSL=false

          AUTH_SERVICE_URL=http://auth:3001
          USER_SERVICE_URL=http://user:3002
          RETAIL_SERVICE_URL=http://retail:3003
          PARA_SERVICE_URL=http://para:3004
          ALIMENTATION_SERVICE_URL=http://alimentation:3005
          FASHION_SERVICE_URL=http://fashion:3007
          MAILER_API_SERVICE_URL=http://mailer-api:3006
          ENGAGEMENT_SERVICE_URL=http://engagement:3008
          WEB_CONTROL_SERVICE_URL=http://web-control:3009

          AUTH_PORT=3001
          USER_PORT=3002
          RETAIL_PORT=3003
          PARA_PORT=3004
          ALIMENTATION_PORT=3005
          FASHION_PORT=3007
          MAILER_API_PORT=3006
          ENGAGEMENT_PORT=3008
          WEB_CONTROL_PORT=3009
          GATEWAY_PORT=3000

          SUPER_ADMIN_EMAIL=superadmin@example.com
          SUPER_ADMIN_PASSWORD=change_me_super_admin_password
          SUPER_ADMIN_NAME=Super Admin
          SUPER_ADMIN_STATE=Tunis
          SUPER_ADMIN_PHONE=

          ALLOWED_ORIGINS=http://localhost:3001

          NEXT_PUBLIC_API_BASE_URL=http://localhost:3000

          UPLOAD_PATH=/app/uploads
          MAX_AVATAR_SIZE_MB=5
          MAX_MEDIA_SIZE_MB=8

          NODE_ENV=deployment
          ENDOFENV

      - name: Determine target URL
        id: target
        run: |
          if [ -n "${{ inputs.zap_target_url }}" ]; then
            echo "url=${{ inputs.zap_target_url }}" >> $GITHUB_OUTPUT
            echo "mode=provided" >> $GITHUB_OUTPUT
          else
            echo "url=http://localhost:3001" >> $GITHUB_OUTPUT
            echo "mode=local" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        if: steps.target.outputs.mode == 'local'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images from GHCR
        if: steps.target.outputs.mode == 'local'
        run: |
          SERVICES="gateway auth user para retail alimentation fashion mailer-api engagement web-control mailer frontend"
          for SVC in $SERVICES; do
            echo "Pulling ${IMAGE_PREFIX}-${SVC}:latest..."
            docker pull ${IMAGE_PREFIX}-${SVC}:latest || echo "WARN: Failed to pull ${SVC}"
          done
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}

      - name: Start containers
        if: steps.target.outputs.mode == 'local'
        run: |
          docker volume create backend_postgres_data
          docker compose -f docker-compose.staging.yml up -d
          echo "Waiting for services to be healthy..."
          sleep 45
          docker compose -f docker-compose.staging.yml ps

      - name: OWASP ZAP Baseline Scan — Frontend (3001)
        if: steps.target.outputs.mode == 'provided' || (steps.target.outputs.mode == 'local' && inputs.zap_mode == 'baseline')
        uses: zaproxy/action-baseline@v0.15.0
        continue-on-error: true
        with:
          target: ${{ steps.target.outputs.url }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j -J zap-frontend-baseline.json -r zap-frontend-baseline.html -M zap-frontend-baseline.md'
          allow_issue_writing: false

      - name: OWASP ZAP Baseline Scan — Backend (3000)
        if: steps.target.outputs.mode == 'provided' || (steps.target.outputs.mode == 'local' && inputs.zap_mode == 'baseline')
        uses: zaproxy/action-baseline@v0.15.0
        continue-on-error: true
        with:
          target: http://localhost:3000
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j -J zap-backend-baseline.json -r zap-backend-baseline.html -M zap-backend-baseline.md'
          allow_issue_writing: false

      - name: OWASP ZAP Full Scan — Frontend (3001)
        if: steps.target.outputs.mode == 'local' && inputs.zap_mode == 'full'
        uses: zaproxy/action-full-scan@v0.13.0
        continue-on-error: true
        with:
          target: ${{ steps.target.outputs.url }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j -J zap-frontend-full.json -r zap-frontend-full.html -M zap-frontend-full.md'
          allow_issue_writing: false

      - name: OWASP ZAP Full Scan — Backend (3000)
        if: steps.target.outputs.mode == 'local' && inputs.zap_mode == 'full'
        uses: zaproxy/action-full-scan@v0.13.0
        continue-on-error: true
        with:
          target: http://localhost:3000
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j -J zap-backend-full.json -r zap-backend-full.html -M zap-backend-full.md'
          allow_issue_writing: false

      - name: Upload ZAP reports (HTML + JSON + MD)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report-${{ inputs.zap_mode || 'baseline' }}
          path: |
            zap-frontend-*
            zap-backend-*
            report.*
          retention-days: 30
          if-no-files-found: ignore

      - name: Stop containers
        if: always() && steps.target.outputs.mode == 'local'
        run: docker compose -f docker-compose.staging.yml down -v

# ─────────────────────────────────────────────
# JOB 4 — SECURITY SUMMARY
# Combines all reports into a single artifact + job summary.
# ─────────────────────────────────────────────
  security-summary:
    name: "Security Summary"
    runs-on: ubuntu-latest
    needs:
      #- sonarqube-scan
      - trivy-scan
      - zap-scan
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: security-reports/
          pattern: '*'
          merge-multiple: true

      - name: Generate summary
        if: always()
        run: |
          echo "## Security Scanning Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Count totals from Trivy
          TOTAL_CRITICAL=0
          TOTAL_HIGH=0
          for f in security-reports/trivy-*-count.md; do
            if [ -f "$f" ]; then
              SVC=$(head -1 "$f" | sed 's/## //')
              CRIT=$(grep "CRITICAL" "$f" | grep -o '[0-9]*' | head -1)
              HIGH=$(grep "HIGH" "$f" | grep -o '[0-9]*' | head -1)
              TOTAL_CRITICAL=$((TOTAL_CRITICAL + CRIT))
              TOTAL_HIGH=$((TOTAL_HIGH + HIGH))
            fi
          done

          echo "### Trivy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Total Found |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| CRITICAL | **$TOTAL_CRITICAL** |" >> $GITHUB_STEP_SUMMARY
          echo "| HIGH | **$TOTAL_HIGH** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Per-service breakdown
          echo "### Per-Service Breakdown" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | CRITICAL | HIGH | Report |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----------|------|--------|" >> $GITHUB_STEP_SUMMARY
          for f in security-reports/trivy-*-count.md; do
            if [ -f "$f" ]; then
              SVC=$(head -1 "$f" | sed 's/## //')
              CRIT=$(grep "CRITICAL" "$f" | grep -o '[0-9]*' | head -1)
              HIGH=$(grep "HIGH" "$f" | grep -o '[0-9]*' | head -1)
              if [ "$CRIT" -gt 0 ]; then
                STATUS="🔴"
              elif [ "$HIGH" -gt 0 ]; then
                STATUS="🟡"
              else
                STATUS="🟢"
              fi
              echo "| $SVC | $STATUS $CRIT | $HIGH | [View](../trivy-$SVC) |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY

          # ZAP section
          echo "### ZAP Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Status | Report |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend (3001) | ${{ needs.zap-scan.result == 'success' && '✅ Completed' || '⚠️ Soft-fail' }} | [View](../zap-report-${{ inputs.zap_mode || 'baseline' }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend (3000) | ${{ needs.zap-scan.result == 'success' && '✅ Completed' || '⚠️ Soft-fail' }} | [View](../zap-report-${{ inputs.zap_mode || 'baseline' }}) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Download links
          echo "### Download" >> $GITHUB_STEP_SUMMARY
          echo "- [All Reports (zip)](../security-reports)" >> $GITHUB_STEP_SUMMARY
          echo "- [Trivy SARIF](../trivy-gateway) — upload to GitHub Security tab" >> $GITHUB_STEP_SUMMARY
          echo "- [ZAP HTML Reports](../zap-report-${{ inputs.zap_mode || 'baseline' }})" >> $GITHUB_STEP_SUMMARY

      - name: Upload combined reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: security-reports/
          retention-days: 30
          if-no-files-found: ignore
