# Staging / VPS deployment — pre-built images from GHCR (no build: blocks).
# IMAGE_PREFIX and TAG are set by deploy-ghcr.sh before `docker compose up`.
# Usage: docker compose -f docker-compose.staging.yml --env-file .env up -d

name: "1111"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-loki-labels: &loki-labels-staging
  loki_scrape: "true"
  loki_tag_environment: "staging"

services:
  postgres:
    image: postgres:16.3-alpine3.20
    container_name: 1111-postgres
    restart: unless-stopped
    env_file: ./.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  retail-postgres:
    image: postgres:16.3-alpine3.20
    container_name: 1111-retail-postgres
    restart: unless-stopped
    env_file: ./.env
    environment:
      POSTGRES_DB: ${RETAIL_DB_NAME}
      POSTGRES_USER: ${RETAIL_DB_USER}
      POSTGRES_PASSWORD: ${RETAIL_DB_PASSWORD}
    volumes:
      - retail_postgres_data:/var/lib/postgresql/data
    networks:
      - stack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RETAIL_DB_USER} -d ${RETAIL_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  para-postgres:
    image: postgres:16.3-alpine3.20
    container_name: 1111-para-postgres
    restart: unless-stopped
    env_file: ./.env
    environment:
      POSTGRES_DB: ${PARA_DB_NAME}
      POSTGRES_USER: ${PARA_DB_USER}
      POSTGRES_PASSWORD: ${PARA_DB_PASSWORD}
    volumes:
      - para_postgres_data:/var/lib/postgresql/data
    networks:
      - stack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PARA_DB_USER} -d ${PARA_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  alimentation-postgres:
    image: postgres:16.3-alpine3.20
    container_name: 1111-alimentation-postgres
    restart: unless-stopped
    env_file: ./.env
    environment:
      POSTGRES_DB: ${ALIMENTATION_DB_NAME}
      POSTGRES_USER: ${ALIMENTATION_DB_USER}
      POSTGRES_PASSWORD: ${ALIMENTATION_DB_PASSWORD}
    volumes:
      - alimentation_postgres_data:/var/lib/postgresql/data
    networks:
      - stack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ALIMENTATION_DB_USER} -d ${ALIMENTATION_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  fashion-postgres:
    image: postgres:16.3-alpine3.20
    container_name: 1111-fashion-postgres
    restart: unless-stopped
    env_file: ./.env
    environment:
      POSTGRES_DB: ${FASHION_DB_NAME}
      POSTGRES_USER: ${FASHION_DB_USER}
      POSTGRES_PASSWORD: ${FASHION_DB_PASSWORD}
    volumes:
      - fashion_postgres_data:/var/lib/postgresql/data
    networks:
      - stack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FASHION_DB_USER} -d ${FASHION_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog-postgres:
    image: postgres:16.3-alpine3.20
    container_name: 1111-catalog-postgres
    restart: unless-stopped
    env_file: ./.env
    environment:
      POSTGRES_DB: ${CATALOG_DB_NAME}
      POSTGRES_USER: ${CATALOG_DB_USER}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD}
    volumes:
      - catalog_postgres_data:/var/lib/postgresql/data
    networks:
      - stack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOG_DB_USER} -d ${CATALOG_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13.3-management-alpine
    container_name: 1111-rabbitmq
    restart: unless-stopped
    env_file: ./.env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:15692:15692"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - stack
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_management rabbitmq_prometheus &&
             docker-entrypoint.sh rabbitmq-server"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  gateway:
    image: ${IMAGE_PREFIX:-ghcr.io/fedi-nasri/1111}-gateway:${TAG:-latest}
    container_name: 1111-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: ./.env
    depends_on:
      auth:
        condition: service_healthy
      user:
        condition: service_healthy
      retail:
        condition: service_healthy
      para:
        condition: service_healthy
      alimentation:
        condition: service_healthy
      fashion:
        condition: service_healthy
      mailer-api:
        condition: service_healthy
      engagement:
        condition: service_healthy
      web-control:
        condition: service_healthy
    networks:
      - stack
    logging: *default-logging
    labels:
      <<: *loki-labels-staging
      loki_tag_service: "gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  auth:
    image: ${IMAGE_PREFIX:-ghcr.io/fedi-nasri/1111}-auth:${TAG:-latest}
    container_name: 1111-auth
    restart: unless-stopped
    env_file: ./.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - stack
    logging: *default-logging
    labels:
      <<: *loki-labels-staging
      loki_tag_service: "auth"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  user:
    image: ${IMAGE_PREFIX:-ghcr.io/fedi-nasri/1111}-user:${TAG:-latest}
    container_name: 1111-user
    restart: unless-stopped
    env_file: ./.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stack
    logging: *default-logging
    labels:
      <<: *loki-labels-staging
      loki_tag_service: "user"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  retail:
    image: ${IMAGE_PREFIX:-ghcr.io/fedi-nasri/1111}-retail:${TAG:-latest}
    container_name: 1111-retail
    restart: unless-stopped
    env_file: ./.env
    environment:
      RETAIL_DB_HOST: retail-postgres
      RETAIL_DB_PORT: 5432
    depends_on:
      retail-postgres:
        condition: service_healthy
    networks:
      - stack
    logging: *default-logging
    labels:
      <<: *loki-labels-staging
      loki_tag_service: "retail"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  para:
    image: ${IMAGE_PREFIX:-ghcr.io/fedi-nasri/1111}-para:${TAG:-latest}
    container_name: 1111-para
    restart: unless-stopped
    env_file: ./.env
    environment:
      PARA_DB_HOST: para-postgres
      PARA_DB_PORT: 5432
    depends_on:
      para-postgres:
        condition: service_healthy
    networks:
      - stack
    logging: *default-logging
    labels:
      <<: *loki-labels-staging
      loki_tag_service: "para"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  alimentation:
    image: ${IMAGE_PREFIX:-ghcr.io/fedi-nasri/1111}-alimentation:${TAG:-latest}
    container_name: 1111-alimentation
    restart: unless-stopped
    env_file: ./.env
    environment:
      ALIMENTATION_DB_HOST: alimentation-postgres
      ALIMENTATION_DB_PORT: 5432
    depends_on:
      alimentation-postgres:
        condition: service_healthy
    networks:
      - stack
    logging: *default-logging
    labels:
      <<: *loki-labels-staging
      loki_tag_service: "alimentation"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  fashion:
    image: ${IMAGE_PREFIX:-ghcr.io/fedi-nasri/1111}-fashion:${TAG:-latest}
    container_name: 1111-fashion
    restart: unless-stopped
    env_file: ./.env
    environment:
      FASHION_DB_HOST: fashion-postgres
      FASHION_DB_PORT: 5432
    depends_on:
      fashion-postgres:
        condition: service_healthy
    networks:
      - stack
    logging: *default-logging
    labels:
      <<: *loki-labels-staging
      loki_tag_service: "fashion"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3007/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailer-api:
    image: ${IMAGE_PREFIX:-ghcr.io/fedi-nasri/1111}-mailer-api:${TAG:-latest}
    container_name: 1111-mailer-api
    restart: unless-stopped
    env_file: ./.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - stack
    logging: *default-logging
    labels:
      <<: *loki-labels-staging
      loki_tag_service: "mailer-api"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3006/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  engagement:
    image: ${IMAGE_PREFIX:-ghcr.io/fedi-nasri/1111}-engagement:${TAG:-latest}
    container_name: 1111-engagement
    restart: unless-stopped
    env_file: ./.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stack
    logging: *default-logging
    labels:
      <<: *loki-labels-staging
      loki_tag_service: "engagement"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3008/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web-control:
    image: ${IMAGE_PREFIX:-ghcr.io/fedi-nasri/1111}-web-control:${TAG:-latest}
    container_name: 1111-web-control
    restart: unless-stopped
    env_file: ./.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stack
    logging: *default-logging
    labels:
      <<: *loki-labels-staging
      loki_tag_service: "web-control"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3009/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailer:
    image: ${IMAGE_PREFIX:-ghcr.io/fedi-nasri/1111}-mailer:${TAG:-latest}
    container_name: 1111-mailer
    restart: unless-stopped
    env_file: ./.env
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - stack
    logging: *default-logging
    labels:
      <<: *loki-labels-staging
      loki_tag_service: "mailer"

  token-cleanup:
    image: postgres:16.3-alpine3.20
    container_name: 1111-token-cleanup
    restart: unless-stopped
    env_file: ./.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stack
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          PGPASSWORD=$$DB_PASSWORD psql -h postgres -U $$DB_USER -d $$DB_NAME \
            -c "SELECT auth.purge_expired_tokens();"
          sleep 86400
        done

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/fedi-nasri/1111}-frontend:${TAG:-latest}
    container_name: 1111-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file: ./.env
    environment:
      CATALOG_DB_HOST: catalog-postgres
      CATALOG_DB_PORT: 5432
      GATEWAY_INTERNAL_URL: http://gateway:3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    depends_on:
      catalog-postgres:
        condition: service_healthy
      gateway:
        condition: service_healthy
    networks:
      - stack
    logging: *default-logging
    labels:
      <<: *loki-labels-staging
      loki_tag_service: "frontend"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    name: backend_postgres_data
    external: true
  retail_postgres_data:
    name: 1111_retail_postgres_data
  para_postgres_data:
    name: 1111_para_postgres_data
  alimentation_postgres_data:
    name: 1111_alimentation_postgres_data
  fashion_postgres_data:
    name: 1111_fashion_postgres_data
  catalog_postgres_data:
    name: 1111_catalog_postgres_data
  rabbitmq_data:
    name: 1111_rabbitmq_data
  uploads:
    name: 1111_uploads

networks:
  stack:
    name: "1111"
    driver: bridge
